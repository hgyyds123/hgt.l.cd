        }

        body {

            min-height: 100vh;
            display: flex;

            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            background: #667eea;
            color: #fff;
            text-decoration: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 15px;
            transition: background 0.3s, transform 0.2s;

            text-decoration: none;
            padding: 10px 32px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .migrate-btn:hover {

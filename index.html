<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hg 网址更新</title>
    <style>
        /* 让页面完全居中，背景纯白 */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFFFFF;
        }

        /* 图片包裹层，控制最大尺寸，防止在电脑上撑爆 */
        .jump-container {
            display: block;
            max-width: 90vw;
            max-height: 90vh;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        /* 鼠标悬停时稍微放大一点点，增加点击欲 */
        .jump-container:hover {
            transform: scale(1.02);
        }

        /* 确保图片自适应 */
        .jump-container img {
            width: 100%;
            height: auto;
            max-width: 800px; /* 最大宽度 800px，视觉最舒服 */
            display: block;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); /* 加一点阴影，更有立体感 */
        }
    </style>
</head>
<body>

    <!-- 点击图片直接跳转 -->
    <a href="https://hg1.dpdns.org" class="jump-container">
        <img src="jump.png" alt="点击前往新网站 hg1.dpdns.org">
    </a>

</body>
</html>

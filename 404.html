<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转…</title>
    <script>
        (function () {
            var newDomain = "https://hg1.dpdns.org";
            var path = window.location.pathname;   // 比如 /looksomethingelse
            var search = window.location.search;   // 查询参数
            var hash = window.location.hash;       // 锚点
            window.location.replace(newDomain + path + search + hash);
        })();
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    正在跳转到新站…
</body>
</html>
